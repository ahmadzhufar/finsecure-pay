apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-deployment
  labels:
    app: finsecure-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-pay
  template:
    metadata:
      labels:
        app: finsecure-pay
    spec:
      containers:
      - name: finsecure-pay
        image: ahmadzhufar/finsecure-pay:v1.1.0
        ports:
        - containerPort: 8080
        env:
        - name: DAILY_LIMIT
          valueFrom:
            configMapKeyRef:
              name: finsecure-config
              key: DAILY_LIMIT
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20